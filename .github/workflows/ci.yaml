name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      # The Dockerfile copies a prebuilt binary from <os>/<arch>/, which is the
      # layout GoReleaser produces. Reproducing it here means CI builds the same
      # image that ships, rather than a second Dockerfile that only CI sees.
      - name: Build the binary into the release layout
        run: |
          mkdir -p linux/amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o linux/amd64/repopsy .

      - name: Build Docker image
        run: DOCKER_BUILDKIT=1 docker build -t repopsy:test .

      - name: Test Docker image
        run: docker run --rm repopsy:test --version
