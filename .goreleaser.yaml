# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: repopsy

before:
  hooks:
    - go mod tidy

builds:
  - id: repopsy
    main: .
    binary: repopsy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

# Replaces the deprecated "brews" section. Note this publishes a Homebrew *cask*
# rather than a formula: casks are macOS-only, and the tap directory moves from
# Formula to Casks.
homebrew_casks:
  - name: repopsy
    repository:
      owner: andpalmier
      name: homebrew-tap
    directory: Casks
    homepage: "https://github.com/andpalmier/repopsy"
    description: "Forensic tool for analyzing git repository history"

# Replaces the deprecated "dockers" and "docker_manifests" sections. One entry
# now covers both architectures: dockers_v2 runs "docker buildx build" across
# platforms and pushes a single multi-platform image, so the per-architecture
# tags and the manifest lists that stitched them together are no longer needed.
dockers_v2:
  - id: repopsy
    images:
      - "ghcr.io/andpalmier/repopsy"
    tags:
      - "{{ .Version }}"
      # Never move "latest" onto a prerelease. An empty tag is ignored.
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Forensic tool for analyzing git repository history"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "https://github.com/andpalmier/repopsy"
      org.opencontainers.image.licenses: "AGPL-3.0"

release:
  github:
    owner: andpalmier
    name: repopsy
  draft: false
  prerelease: auto
